name: Deploy AWS

# Chamado pelo CI depois dos testes em push na main, ou manualmente pela aba Actions.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  STACK_NAME: bom-gosto-prod

jobs:
  build:
    name: Imagem ${{ matrix.app }}
    # O servidor é ARM64 (Graviton); o runner ARM gera a imagem sem emulação.
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/bom-gosto/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Atualizar servidor
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: ${{ steps.stack.outputs.site_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ler dados da infraestrutura
        id: stack
        run: |
          saida() {
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          {
            echo "instance_id=$(saida InstanceId)"
            echo "registry=$(saida EcrRegistry)"
            echo "site_url=$(saida SiteUrl)"
          } >> "$GITHUB_OUTPUT"

      - name: Executar deploy no servidor (SSM)
        id: command
        env:
          INSTANCE_ID: ${{ steps.stack.outputs.instance_id }}
          REGISTRY: ${{ steps.stack.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          COMPOSE_B64=$(base64 -w0 deploy/docker-compose.prod.yml)
          SCRIPT_B64=$(base64 -w0 deploy/deploy.sh)
          jq -n --arg compose "$COMPOSE_B64" --arg script "$SCRIPT_B64" \
                --arg registry "$REGISTRY" --arg tag "$TAG" --arg region "$AWS_REGION" '{
            commands: [
              "set -euo pipefail",
              "echo \($compose) | base64 -d > /opt/bom-gosto/docker-compose.prod.yml",
              "echo \($script) | base64 -d > /opt/bom-gosto/deploy.sh",
              "chmod 700 /opt/bom-gosto/deploy.sh",
              "AWS_REGION=\($region) /opt/bom-gosto/deploy.sh \($registry) \($tag)"
            ],
            executionTimeout: ["900"]
          }' > params.json
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${TAG:0:7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Aguardar resultado
        env:
          INSTANCE_ID: ${{ steps.stack.outputs.instance_id }}
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
        run: |
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status final: $STATUS"
          test "$STATUS" = Success

      - name: Testar o site pelo CloudFront
        env:
          SITE_URL: ${{ steps.stack.outputs.site_url }}
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 -o /dev/null "$SITE_URL/"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 "$SITE_URL/api/auth/csrf/" -o /dev/null
          echo "Site no ar: $SITE_URL"
