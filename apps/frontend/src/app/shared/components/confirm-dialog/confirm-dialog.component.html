<div class="modal-backdrop" role="presentation" (click)="close()">
  <section
    class="modal"
    [class.modal--lg]="size() === 'lg'"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="confirm-dialog-title"
    (click)="$event.stopPropagation()"
  >
    <header class="modal__header">
      <div class="modal__heading">
        <h2 id="confirm-dialog-title" class="modal__title">{{ title() }}</h2>
        @if (message()) {
          <p class="modal__subtitle">{{ message() }}</p>
        }
      </div>
      <button type="button" class="modal__close" aria-label="Fechar" (click)="close()">
        <svg [lucideIcon]="'x'" [size]="18"></svg>
      </button>
    </header>

    <div class="modal__body">
      <ng-content />
    </div>

    <footer class="modal__footer">
      @if (error()) {
        <p class="modal__error" role="alert">{{ error() }}</p>
      }
      <div class="modal__actions">
        <app-button variant="outline" [disabled]="busy()" (click)="close()">
          {{ cancelLabel() }}
        </app-button>
        <app-button [variant]="variant()" [disabled]="busy()" (click)="confirm()">
          {{ confirmLabel() }}
        </app-button>
      </div>
    </footer>
  </section>
</div>
