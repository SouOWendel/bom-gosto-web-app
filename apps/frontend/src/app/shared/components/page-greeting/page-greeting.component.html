<section class="page-greeting">
  <div class="page-greeting__text">
    <h1 class="page-greeting__title">
      {{ title() }}
    </h1>
    @if (subtitle()) {
      <p class="page-greeting__subtitle">
        {{ subtitle() }}
      </p>
    }
  </div>

  @if (actions().length > 0) {
    <div class="page-greeting__actions">
      @for (action of actions(); track action.label) {
        @if (action.route) {
          <a
            [routerLink]="action.route"
            class="btn"
            [class.btn--primary]="action.variant === 'primary' || !action.variant"
            [class.btn--secondary]="action.variant === 'secondary'"
            [class.btn--outline-primary]="action.variant === 'outline-primary'"
            (click)="onActionClick(action)"
          >
            @if (action.icon) {
              <svg [lucideIcon]="action.icon" [size]="16" [strokeWidth]="2"></svg>
            }
            <span>{{ action.label }}</span>
          </a>
        } @else {
          <button
            type="button"
            class="btn"
            [class.btn--primary]="action.variant === 'primary' || !action.variant"
            [class.btn--secondary]="action.variant === 'secondary'"
            [class.btn--outline-primary]="action.variant === 'outline-primary'"
            (click)="onActionClick(action)"
          >
            @if (action.icon) {
              <svg [lucideIcon]="action.icon" [size]="16" [strokeWidth]="2"></svg>
            }
            <span>{{ action.label }}</span>
          </button>
        }
      }
    </div>
  }
</section>
