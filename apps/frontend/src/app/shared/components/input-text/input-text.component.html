<div class="field">
  @if (label) {
    <label class="field__label" [for]="inputId">{{ label }}</label>
  }

  <div
    class="field__wrapper"
    [class.field__wrapper--password]="type === 'password'"
    [class.field__wrapper--suffix]="suffix"
    [class.field__wrapper--compact]="size === 'compact'"
    [class.field__wrapper--icon]="icon || type === 'password'"
  >
    @if (icon || type === 'password') {
      <span class="field__icon field__icon--left" aria-hidden="true">
        <svg [lucideIcon]="type === 'password' ? 'lock' : icon" [size]="16" />
      </span>
    }

    <input
      class="field__input"
      [id]="inputId"
      [type]="showPassword ? 'text' : type"
      [value]="value"
      [attr.autocomplete]="autocomplete"
      [placeholder]="placeholder"
      [disabled]="disabled"
      (input)="handleInput($any($event.target).value)"
      (blur)="handleBlur()"
    />

    @if (suffix) {
      <span class="field__suffix">{{ suffix }}</span>
    }

    @if (type === 'password') {
      <button
        type="button"
        class="field__toggle"
        (click)="togglePassword()"
        [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'"
        tabindex="-1"
      >
        @if (showPassword) {
          <svg [lucideIcon]="'eye-off'" [size]="17" />
        } @else {
          <svg [lucideIcon]="'eye'" [size]="17" />
        }
      </button>
    }
  </div>
</div>
