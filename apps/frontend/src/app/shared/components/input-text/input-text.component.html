<div class="field">
  @if (label) {
    <label class="field__label" [for]="inputId">{{ label }}</label>
  }

  <div class="field__wrapper" [class.field__wrapper--password]="type === 'password'">
    <!-- Ícone do lado esquerdo -->
    <span class="field__icon field__icon--left" aria-hidden="true">
      @if (type === 'password') {
        <!-- Ícone cadeado -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      } @else {
        <!-- Ícone arroba / e-mail -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/>
        </svg>
      }
    </span>

    <input
      class="field__input"
      [id]="inputId"
      [type]="showPassword ? 'text' : type"
      [value]="value"
      [attr.autocomplete]="autocomplete"
      [placeholder]="placeholder"
      [disabled]="disabled"
      (input)="handleInput($any($event.target).value)"
      (blur)="handleBlur()"
    />

    <!-- Botão de toggle para senha -->
    @if (type === 'password') {
      <button
        type="button"
        class="field__toggle"
        (click)="togglePassword()"
        [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'"
        tabindex="-1"
      >
        @if (showPassword) {
          <!-- Olho fechado -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        } @else {
          <!-- Olho aberto -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        }
      </button>
    }
  </div>
</div>
