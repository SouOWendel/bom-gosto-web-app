<div class="main-layout">
  <app-sidebar
    [items]="sidebarItems"
    [user]="userProfile()"
    [mobileOpen]="menuOpen()"
    brandTitle="Bom Gosto"
    brandSubtitle="BOLOS & DOCES"
    (itemClick)="closeMenu()"
    (logout)="onLogout()"
  />

  @if (menuOpen()) {
    <div class="main-layout__overlay" aria-hidden="true" (click)="closeMenu()"></div>
  }

  <main class="main-layout__content">
    <app-topbar [menuOpen]="menuOpen()" (menuToggle)="toggleMenu()" />
    <router-outlet />
  </main>
</div>
